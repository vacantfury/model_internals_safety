[project]
name = "model-internals-safety"
version = "0.1.0"
description = "Diagnosing and repairing safety failures under encoded inputs (model-internals safety line, first paper)"
readme = "README.md"
requires-python = ">=3.12,<3.15"

# Deps are added per build-order step (text_docs/project_structure.md §6), not
# all up front. This is step 1: the forward-pass instrumentation spine.
# Step 3 adds the judge layer (llm_utils + provider SDKs); step 5 adds peft.
dependencies = [
    "torch>=2.6,<3",
    "transformers>=4.51,<6",
    "accelerate>=1.0,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    # Imported directly by probes/linear.py's `single_threaded_blas`, which is
    # load-bearing for wall-clock (31x on the cluster), so it is declared rather
    # than inherited from scikit-learn's transitive tree — a dep we import must
    # not depend on another package continuing to pull it in.
    "threadpoolctl>=3.1,<4",
    "pyyaml>=6.0,<7",
    "pydantic>=2.10,<3",
    "llm-utils",
    "json-repair>=0.56,<1",
    # Needed to LOAD one of AS-6's two guards, not for anything we call directly.
    # WildGuard ships `tokenizer.model` (SentencePiece) with no `tokenizer.json`,
    # so transformers must convert slow->fast at load; without these two it
    # misreads the proto as a tiktoken file and dies with a message naming
    # neither package. Undeclared, that is a cluster job failing at minute one.
    "sentencepiece>=0.2,<1",
    "protobuf>=4,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
]

[tool.uv]
package = true

# Torch's CUDA build must match the CLUSTER DRIVER, not the newest release.
# NEU Explorer's GPU nodes run driver 12.8 (reported as 12080). CUDA 12.x works
# there by minor-version forward compatibility; CUDA 13 does NOT — a cu130 wheel
# fails `torch.cuda.is_available()` on every node, and the job then silently
# falls back to CPU. Same recipe and same reason as the guardrail sibling's
# cluster env builder, which pins cu128 with the note "cu130 does NOT".
#
# Pinned for Linux only: macOS has no CUDA wheels, and local dev wants the
# default PyPI build for MPS.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
llm-utils = { git = "https://github.com/vacantfury/llm_utils.git", rev = "v5.0.0" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/internals_safety"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Default test suite is hermetic: no network, no secrets, no model download.
    # Anything that pulls real weights is marked `slow` and deselected by default.
    "slow: needs network and/or real model weights",
]
addopts = "-m 'not slow'"

# The post-training contrast arm — SAME BASE WEIGHTS as llama3_1_8b_instruct.
#
# This is the most scientifically valuable model in the slate and the reason is
# what it holds FIXED. Llama-3.1-8B-Instruct and Tulu-3-8B are the same
# Llama-3.1-8B base with two entirely different post-training pipelines: Meta's
# closed RLHF, and Ai2's fully open SFT -> DPO -> RLVR recipe. §4a's dissociation
# currently compares three unrelated models, so "a property of safety training"
# is an inference. Against this arm it becomes a controlled comparison: same
# base, same tokenizer family, same scale, different post-training.
#
# Three further things it buys, none available from an unrelated family:
#
# 1. **A staged series.** Ai2 ships -SFT and -DPO checkpoints alongside the final
#    model, and `llama3_1_8b_base.yaml` is already configured. So the ladder is
#    Base (no safety training at all) -> SFT -> DPO -> RLVR, against
#    Meta-Instruct as the contrast. That asks at WHICH post-training stage
#    encoding-driven blanket refusal appears, which no cross-family comparison
#    can ask.
# 2. **A shared SAE dictionary.** Llama Scope is fitted on Llama-3.1-8B-Base and
#    every model above is a fine-tune of it, so one dictionary plausibly reads
#    the whole series — I4 feature comparison ACROSS post-training recipes.
#    ⚠️ The transfer ratio 1.009-1.017 (job 9010205) that this rested on is
#    WITHDRAWN pending a re-run: its Instruct arm carried a double BOS while the
#    ceiling arm did not, so the contamination sat on one side of that ratio.
#    See `text_docs/shared/instrument_layer.md` §4.7. The argument for a shared
#    dictionary is unchanged — it rests on shared base weights — but the NUMBER
#    may not be quoted until re-measured.
# 3. **An open recipe.** Ai2 publishes the post-training data, so a difference
#    can be attributed to something nameable rather than left as a black box.
#
# ⚠️ THREE CHECKPOINT FACTS, VERIFIED 2026-08-08, THAT MAKE THIS NOT A DROP-IN:
#
# a. **The template emits NO BOS.** It renders `<|user|>\n...\n<|assistant|>\n`
#    and nothing else, so under the repo's `add_special_tokens=False` capture
#    path token 0 is `<`, not `<|begin_of_text|>`. Llama-3.1-Instruct and Mistral
#    both put BOS at token 0. The phase-0 capture path does not drop token 0, so
#    nothing there is affected.
#    ⚠️ **CORRECTION 2026-08-08 — the SAE consequence first recorded here was
#    WRONG, and measuring it found a real defect elsewhere.** This said I4's
#    `drop_bos` would drop content on this model. It would not have: that path
#    tokenised with the DEFAULT `add_special_tokens=True`, and this checkpoint's
#    post-processor prepends `<|begin_of_text|>` even though the template does
#    not — so token 0 was BOS after all. What the measurement did find is that
#    the same default gave Llama-3.1-Instruct and Mistral a DOUBLE BOS in the
#    chat arm, contaminating the target side of the pre-gate's transfer ratio
#    while the plain ceiling arm stayed clean. Fixed by
#    `tokenize_for_reconstruction` plus dropping BOS by identity; full record in
#    `text_docs/shared/instrument_layer.md` §4.7. The lesson kept from this entry
#    is the general one, and it was later confirmed from the opposite direction
#    (see `prepend_bos_to_chat_template` below): a BOS assumption must be READ
#    off the checkpoint's tokenizer.json, never inferred from its template.
# b. **`<|user|>` and `<|assistant|>` are NOT special tokens.** They shatter into
#    five pieces each (`<`, `|`, `user`, `|`, `>\n`). Only `<|begin_of_text|>` is
#    in the added-tokens table. So nothing may key off role markers being single
#    tokens.
# c. **It exposed a real bug in `instruction_final`** (fixed same day). Its bare
#    "\n" after the content merges with the content's last character, and the
#    offset filter kept only tokens lying wholly inside the message — so the
#    readout landed one token early, silently. Llama/Qwen/Mistral force a clean
#    break and were never affected. Pinned by `tests/test_real_instruction_final.py`.
# ## Provenance — canonical home is `text_docs/shared/model_slate.md`
# **TÜLU 3: Pushing Frontiers in Open Language Model Post-Training** — Lambert
# et al., arXiv 2411.15124. Evidence tier **(A) — COLM 2025**.
#
# ⚠️ **CORRECTION 2026-08-08.** This block first read "tier (B), no peer-reviewed
# venue found — a COLM listing was searched for specifically and NOT found".
# That was WRONG, and wrong in the way the lit-search handbook already names: the
# check was run against dblp, which records this paper as CoRR only, and a failed
# lookup was then reported as evidence of absence. The OpenReview PDF
# (openreview.net/pdf?id=i1uGbfHHpH) carries the header "Published as a
# conference paper at COLM 2025". **Venue goes to OpenReview or the proceedings,
# never to a metadata aggregator alone** — this is the strongest-provenance model
# in the slate and it was tiered two tiers too low.
#
# This is the one model in the slate whose paper is load-bearing for the SCIENCE
# rather than just for attribution: the post-training recipe (SFT -> DPO ->
# RLVR) is published with its data, so a behavioural difference against
# `llama3_1_8b_instruct` on identical base weights can be traced to a named
# stage. RLVR is the paper's own novel contribution and is the stage with no
# counterpart in Meta's pipeline.
name: tulu3_8b
hf_id: allenai/Llama-3.1-Tulu-3-8B
dtype: auto
device: auto
trust_remote_code: false

# Matches the rest of the slate — no model gets a safety preamble the others lack.
system_prompt: null
capture_batch_size: 8

# From config.json (`num_hidden_layers` = 32) — identical to Llama-3.1-8B, which
# is the point: layer indices are directly comparable to the Instruct arm.
n_layers: 32

capture:
  site: resid_pre
  layers: all
  positions:
    - instruction_final
    - last

# Single-token on THIS checkpoint (vocab 128264): 'I'=40, 'Sure'=40914, 'Here'=8586.
# ⚠️ REQUIRED SINCE `verify_bos_convention` LANDED — this config could not attach
# without it. The no-BOS fact this file already records is now ENFORCED rather
# than documented: `models/loader.verify_bos_convention` refuses any checkpoint
# whose tokenizer declares a BOS token its chat template never emits, until the
# config says which way to go. Documenting the trap in a comment left the trap.
#
# `true`, settled by the artifact 2026-08-08 rather than by argument. This
# checkpoint's `tokenizer.json` post-processor is structurally IDENTICAL to
# Llama-3.1-8B-Instruct's — `Sequence[ByteLevel, TemplateProcessing
# single=['<|begin_of_text|>', 'A']]` on both. Ai2 did not disable BOS; they kept
# Llama-3.1's post-processor and simply did not duplicate the token in the
# template. The tokenizer's own contract still says prepend it, so a BOS-less run
# is our `add_special_tokens=False` convention stripping a token this checkpoint
# expects. Full evidence and the ladder-level reasoning: `tulu3_8b_sft.yaml`.
#
# ⚠️ THEREFORE JOB 9011034 IS SUPERSEDED. It ran this checkpoint BOS-less, so it
# is off-distribution AND not comparable to the SFT/DPO rungs, which run with
# BOS. It must be re-run before the ladder can be differenced; a ladder whose
# rungs disagree about BOS measures BOS.
prepend_bos_to_chat_template: true

refusal_openings:
  - "I"

compliance_openings:
  - "Sure"
  - "Here"

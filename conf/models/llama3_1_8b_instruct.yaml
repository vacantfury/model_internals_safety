# Phase-0 pilot candidate (gated HF repo — needs an accepted licence on the
# account running it). Second family alongside Qwen so a regime result is not a
# single tokenizer's artifact. Slate settled at S2.
# ## Provenance
# **The Llama 3 Herd of Models** — Grattafiori et al., arXiv 2407.21783 (2024).
# Evidence tier **(B)**: arXiv technical report, very large independent uptake;
# dblp records CoRR only, no peer-reviewed venue found (checked 2026-08-08).
# The report covers pre-training and post-training together; the safety
# fine-tuning it describes is one arm of this repo's post-training comparison
# against `tulu3_8b`, which shares this model's base weights.
name: llama3_1_8b_instruct
hf_id: meta-llama/Llama-3.1-8B-Instruct
dtype: auto
device: auto
trust_remote_code: false
system_prompt: null
capture_batch_size: 8
# Transformer blocks, read from the checkpoint's own config.json
# (`num_hidden_layers` = 32). A fact about the model, not a tunable — the
# pre-run cost estimate prices layer-proportional instruments before any
# weights load, and `attach` asserts this against the real model.
n_layers: 32

capture:
  site: resid_pre
  layers: all
  positions:
    - instruction_final
    - last

# Refusal-opening tokens for the causal gate. Upstream's own Llama-3 table is
# [40] = 'I' (other_repos/refusal_direction, llama3_model.py).
refusal_openings:
  - "I"

# The complying counterpart, for I6's logit difference. Verified single-token
# against this checkpoint's tokenizer by tests/test_real_model.py.
compliance_openings:
  - "Sure"
  - "Here"

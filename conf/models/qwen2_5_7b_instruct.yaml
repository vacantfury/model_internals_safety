# Phase-0 pilot candidate. The pilot's final 2-model slate is an S2 decision
# (TODO item 1) — this file exists so the harness has a real config to run
# against, not because the choice is settled.
name: qwen2_5_7b_instruct
hf_id: Qwen/Qwen2.5-7B-Instruct
dtype: auto
device: auto
trust_remote_code: false
system_prompt: null
capture_batch_size: 8

capture:
  site: resid_pre
  layers: all
  positions:
    - instruction_final
    - last

# Refusal-opening tokens for the causal gate. Upstream's own Qwen table is
# [40, 2121] = 'I', 'As' (other_repos/refusal_direction, qwen_model.py).
refusal_openings:
  - "I"
  - "As"

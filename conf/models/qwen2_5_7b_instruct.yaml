# Phase-0 pilot candidate. The pilot's final 2-model slate is an S2 decision
# (TODO item 1) — this file exists so the harness has a real config to run
# against, not because the choice is settled.
# ## Provenance
# **Qwen2.5 Technical Report** — Qwen Team, arXiv 2412.15115 (2024).
# Evidence tier **(B)**: arXiv technical report, large independent uptake; dblp
# records CoRR only, no peer-reviewed venue found (checked 2026-08-08).
# Qwen-Scope (arXiv 2605.11887) is the matching SAE suite for this family, and
# is the reason a Qwen arm is reachable for I4 at all.
name: qwen2_5_7b_instruct
hf_id: Qwen/Qwen2.5-7B-Instruct
dtype: auto
device: auto
trust_remote_code: false
system_prompt: null
capture_batch_size: 8
# Transformer blocks, read from the checkpoint's own config.json
# (`num_hidden_layers` = 28). A fact about the model, not a tunable — the
# pre-run cost estimate prices layer-proportional instruments before any
# weights load, and `attach` asserts this against the real model.
n_layers: 28

capture:
  site: resid_pre
  layers: all
  positions:
    - instruction_final
    - last

# Refusal-opening tokens for the causal gate. Upstream's own Qwen table is
# [40, 2121] = 'I', 'As' (other_repos/refusal_direction, qwen_model.py).
refusal_openings:
  - "I"
  - "As"

# The complying counterpart, for I6's logit difference. Verified single-token
# against this checkpoint's tokenizer by tests/test_real_model.py.
compliance_openings:
  - "Sure"
  - "Here"

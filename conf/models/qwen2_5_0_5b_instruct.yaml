# Small instruct model — used for pipeline smoke runs on a laptop, not for
# results. Kept in-family with the 7B so a smoke run exercises the same chat
# template and layer layout as the pilot model.
name: qwen2_5_0_5b_instruct
hf_id: Qwen/Qwen2.5-0.5B-Instruct
dtype: auto
device: auto
trust_remote_code: false
system_prompt: null
capture_batch_size: 8
# Transformer blocks, read from the checkpoint's own config.json
# (`num_hidden_layers` = 24). A fact about the model, not a tunable — the
# pre-run cost estimate prices layer-proportional instruments before any
# weights load, and `attach` asserts this against the real model.
n_layers: 24

capture:
  site: resid_pre
  layers: all
  positions:
    - instruction_final
    - last

# Refusal-opening tokens for the causal gate. Upstream's own Qwen table is
# [40, 2121] = 'I', 'As' (other_repos/refusal_direction, qwen_model.py).
refusal_openings:
  - "I"
  - "As"

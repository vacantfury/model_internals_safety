# The second arm. Submit ONLY after the Base arm has been read — see
# `sae_pregate_base.yaml` for why the ordering carries the loader's correctness.
#
# Bonus this arm buys for the other paper: Llama Guard 3 8B is itself a
# fine-tune of the same base, so a transfer result here is evidence about
# AS-6's guard as well as AS-5's target. One validation, two papers.
entrypoint: sae_pregate
description: >-
  The same dictionaries against our actual target, Llama-3.1-8B-Instruct.
  The Base-to-Instruct gap is the quantity of interest.

gates: >-
  Whether the I4 FEATURE instrument gets written. The build plan gates it on
  this pre-gate passing, so a large transfer gap ends I4 here rather than after
  a feature analysis built on a dictionary that does not describe our model —
  and it sets `min_transfer_ratio` from the measured gap rather than from the
  unearned 0.80 sitting in measurements.yaml.

  This arm specifically answers whether I4 is usable on AS-5's REAL inputs,
  which are chat-templated. A collapse here is not a bug — it is the finding
  that a Base-fitted dictionary cannot read chat-formatted activations, and it
  would end I4 for AS-5 before the feature instrument is written rather than
  after.

target: llama3_1_8b_instruct

# The CEILING this arm is judged against: the plain-text Base run, the model the
# dictionary was fitted on. Per layer — `tasks()` appends `-L<layer>`.
#
# ⚠️ The ceiling is PLAIN and this arm is TEMPLATED, which is deliberate and is
# the one comparison in this pair that does NOT isolate a single variable. It
# cannot: the templated Base ceiling is -915, so there is no meaningful
# denominator on that side. Read this arm as "the dictionary on the distribution
# AS-5 actually produces, against its best case", and read
# `sae_pregate_instruct_plain` for the clean model-only transfer number.
source_runs:
  llama3_1_8b_base: pregate-base-plain

sae_layers: [17, 19, 21]

n_prompts: 100
run_name: pregate-instruct

resources:
  partition: gpu
  gres: gpu:h200:1
  cpus: 8
  mem: 64G
  time: "01:00:00"

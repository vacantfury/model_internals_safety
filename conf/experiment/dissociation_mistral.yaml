# The third model family — the test §4a's dissociation has not had.
#
# `evidence_and_story.md` §4a reads a line through two points: Llama-3.1-8B
# refuses encoded benign content at 0.61 with 27-43% binding failure on decoded
# cells; Qwen2.5-7B refuses benign at 0.21 with 5-11%. The claim is that blanket
# surface refusal comes with WEAKER binding on inputs the model understood, so
# the aggregate refusal rate ranks the models opposite to the
# comprehension-conditioned rate.
#
# Mistral-7B-Instruct-v0.3 is chosen to sit at the PERMISSIVE end, opposite
# Llama and beyond Qwen, so the run can refute rather than confirm. See
# `conf/models/mistral_7b_instruct.yaml` for why a third well-aligned model
# would have tested nothing.
#
# THE SAME THREE RUNGS Qwen ran, so the comparison is like-for-like. No new
# rungs: this run answers a model question, and mixing in an encoding question
# would leave neither clean — the same discipline `benign_arm_qwen.yaml` used.
#
# FIVE control rungs, which is the point of the count. The Qwen run carried NO
# can't-decode rung, so its control floor came back `kind: none, n_controls: 0`
# and its deployment licensing is permutation-only — precisely the "significance
# is not sufficiency" gap the floor exists to close. The adopted rule is
# `mean + sigma*SD` with sigma=2.0 and a 5-control minimum, BELOW which it falls
# back to max and is labelled a `bound` (instrument_layer §2.4). Llama's band run
# got one qualifying control and therefore a bound. Five candidates are shipped
# here so this run can produce the first properly-derived floor in the repo:
# base64 (inert on both prior models), reverse_characters and tag_block (ability
# 0.00 on both), math_sans (0.00 on Llama), circled (0.08 on Llama).
#
# They are CANDIDATES, not controls by declaration — a rung is a control only if
# it measures can't-decode on THIS model, which is a result of the run. If
# Mistral reads any of them, the floor is computed from however many remain and
# is labelled accordingly. That is the correct behaviour and not a fallback.
entrypoint: phase0_regime_map
description: >-
  The §4a dissociation on a third model family — Mistral-7B-Instruct-v0.3 on the
  three rungs Qwen measured, plus five can't-decode candidates so the deployment
  floor is derived rather than bounded.

gates: >-
  Whether §4a is a finding or a coincidence between two models, which decides
  what the paper claims and whether it claims it about safety training at all.

  If Mistral shows LOW benign refusal and LOW binding failure, the axis holds
  across three independent post-training pipelines (Meta, Alibaba, Mistral) and
  the paper can say blanket surface refusal tracks weak binding. If it shows LOW
  benign refusal and HIGH binding failure, the axis is REFUTED — blanket refusal
  and weak binding are independent, §4a's reading collapses to a two-model
  coincidence, and the paper falls back to the measurement contribution that §5
  recommended before the Qwen arm ran. Both are one run away and the second is a
  live possibility.

  Secondary gate, and it is a build decision rather than a paper one: whether the
  five control candidates yield a derived `mean + 2SD` floor. If they do, every
  deployment number in the paper can be screened against a real floor and the
  earlier bounds get re-read. If Mistral turns out to read some of them, the
  5-control minimum is not reachable at this ladder size and the floor rule needs
  a cheaper control source than a full rung.

target: mistral_7b_instruct

families:
  # substrate — the three Qwen measured
  - fullwidth
  - homoglyph
  - zero_width
  # can't-decode candidates for the floor
  - base64
  - reverse_characters
  - tag_block
  - math_sans
  - circled

n_prompts: 100

instruments: [lexical]
run_name: dissociation-mistral

resources:
  partition: gpu
  gres: gpu:h200:1
  cpus: 8
  mem: 64G
  time: "08:00:00"

# Claims whose SET lives in a run artefact rather than in the paper.
#
# `paper_claims.py` checks the claims a document can check against itself. These
# are the other half: a sentence asserting a cardinality that only a run record
# can confirm. Both defects that motivated this file were of exactly this shape,
# found by recomputing the claim's set and comparing, not by tracing provenance
# forward.
#
# There is ONE truth per claim and it is the PAPER. `locate` finds the sentence
# and captures the number it asserts; `recipe` names the recomputation. The
# ledger states which is which and holds no third copy of the value, so it
# cannot go stale in a direction nobody notices.
#
# definitional: `recipe` is a CLOSED vocabulary implemented in
# scripts/claim_sets.py. An unknown recipe is a hard failure, never a skip — the
# typed residual, failing toward attention.

claims:
  - id: spread_screened_cells
    paper: as-5
    recipe: spread_echo_measured_cells
    claim: >-
      the count of model-by-rung cells on which the echo screen returned a
      verdict, which must EXCLUDE the cells where it could not (n_clean = 0)
    locate: '\$(\d+)\$ model-by-rung cells we screened'

  - id: ladder_cells_rejected
    paper: as-5
    recipe: ladder_reported_cells_rejected
    claim: reported pipeline cells the echo screen rejects
    locate: 'it rejects (\w+) of the \w+ cells'

  - id: ladder_cells_total
    paper: as-5
    recipe: ladder_reported_cells_total
    claim: reported pipeline cells in total (3 stages x 3 encodings)
    locate: 'it rejects \w+ of the (\w+) cells'

  - id: rungs_passing_every_screen
    paper: as-5
    recipe: spread_rungs_passing_every_screen
    claim: >-
      rungs clearing readability, exact invertibility and the echo screen on all
      four models. Homoglyph is asserted to be the only one, so this is 1.
    locate: 'Homoglyph is the (only) rung passing every screen on all four models'
    expect_word: one

  # --- AS-6. These carry `source:`, the provenance half.
  #
  # A claim names the artefact it came from and the recomputation opens THAT
  # artefact. Added 2026-08-21 after a ledger sentence named the
  # causal-intervention run as Table 2's source and five items sat blocked on a
  # down-sync for a day while the real data was already on disk. A pointer is a
  # claim, and it recomputes.

  - id: as6_table2_provenance
    paper: as-6
    recipe: as6_table2_provenance
    check: internal
    source: analysis/operating_point_*_20260808.json
    percentile: 75.0
    claim: >-
      every D&notB count in Table 2 appears in the named artefact at the named
      operating point. Fails if the source does not hold the paper's numbers,
      which is the wrong-pointer defect rather than a wrong-count one.

  - id: as6_bwd_max_reported
    paper: as-6
    recipe: as6_bwd_max_reported
    source: runs/as6_phase1/*/as6p1-full-20260805/results.json
    claim: >-
      the largest blocked-without-decoding rate, per 100, over the pairs Table 2
      reports. The reported set is parsed from the table, so the bound tracks it.
    locate: 'at most (\d+) per 100 on every guard'

  - id: as6_bwd_zero_pairs
    paper: as-6
    recipe: as6_bwd_zero_pairs
    source: runs/as6_phase1/*/as6p1-full-20260805/results.json
    claim: pairs whose blocked-without-decoding cell is exactly zero
    locate: 'exactly 0 on (\d+) of the \d+ pairs'

  - id: as6_bwd_measurable_pairs
    paper: as-6
    recipe: as6_bwd_measurable_pairs
    source: runs/as6_phase1/*/as6p1-full-20260805/results.json
    claim: >-
      pairs where the cell is measurable at all, i.e. the decode read is
      licensed. The complement is the unmeasured band and must never be folded in.
    locate: 'exactly 0 on \d+ of the (\d+) pairs'

  - id: as6_bwd_unlicensed_pairs
    paper: as-6
    recipe: as6_bwd_unlicensed_pairs
    source: runs/as6_phase1/*/as6p1-full-20260805/results.json
    claim: >-
      pairs whose decode measurement is not licensed. The recipe additionally
      RAISES unless every one of their block rates is 0.00, because section 5.8's
      containment argument rests on exactly that.
    locate: 'On the (\w+) pairs whose decode measurement is not licensed'

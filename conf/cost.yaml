# Cost model — the input to the experiment-run approval gate.
#
# Family rule (owner 2026-07-22): before ANY run, report GPU count/type, money
# and wall-clock, and get an explicit go. `scripts/cost_model.py` turns a token
# census into those three numbers; this file holds every assumption it uses.
#
# ## Which numbers here are measured and which are assumed
#
# The token counts are NOT here — they are measured exactly by tokenising the
# real corpus under every rung (`cost.census_phase0`), because encodings inflate
# prompt length by 1.2x to 17x and an assumed inflation factor would dominate
# the estimate's error. What IS assumed is hardware throughput, which cannot be
# known before running on the actual cluster node.
#
# Every throughput number below is therefore a placeholder with one tuning path:
# **the first real run measures it**. `scripts/phase0_regime_map.py` records
# observed prefill and decode rates into its run record (`metrics.throughput`),
# and those observations replace these guesses for phases 1-3. Until then the
# estimate is reported as a range, never a point.

hardware:
  # Ranges are wide on purpose: HuggingFace `generate` is not a serving stack,
  # and its decode rate varies several-fold with batch size, sequence length and
  # attention implementation. Narrow these from measured runs, not from vendor
  # peak-FLOPs arithmetic.
  #
  # prefill_tokens_per_s — prompt tokens/second in a forward pass with
  #   `output_hidden_states=True`. Compute-bound. Capture writes every layer's
  #   residual stream, so it is materially slower than a plain forward pass;
  #   the low end of each range assumes that cost dominates.
  # decode_tokens_per_s — aggregate new tokens/second across the batch, greedy.
  #   Memory-bandwidth-bound, so it tracks HBM bandwidth more than FLOPs.
  # load_seconds — weights from shared filesystem into VRAM, once per run.
  #
  # !! MEASUREMENT STATUS (2026-08-04) — read before costing on any profile !!
  # Only `h200_144gb` has been measured against a real run. Its decode figure
  # moved from an assumed [300, 1200] to a measured [40, 71]: a 7.5-17x
  # overestimate that made the phase-0 prediction 2-4x too cheap. The error was
  # not arithmetic, it was CATEGORY — the assumed numbers were kernel-style
  # throughput, whereas the estimator needs an EFFECTIVE end-to-end rate that
  # absorbs model load, capture passes, unbatched generation and synchronous
  # judge latency.
  # The a100/v100 entries below are still pre-measurement assumptions of that
  # same wrong category, so they are optimistic by a similar factor and must be
  # treated as LOWER BOUNDS on time, not estimates. Measure before trusting one
  # for an approval-gate figure; do not silently scale them.
  a100_40gb:
    label: "A100 40GB (SXM)"
    vram_gb: 40
    prefill_tokens_per_s: [2000, 8000]
    # PLACEHOLDER, for the same reason as a100_80gb below and with the same
    # tuning path. No run has ever used this card.
    decode_tokens_per_s: [150, 600]
    load_seconds: 300
    measured: false   # no run has ever used this card
  a100_80gb:
    label: "A100 80GB"
    vram_gb: 80
    prefill_tokens_per_s: [2000, 8000]
    # ⚠️ PLACEHOLDER — the ONLY measured hardware in this file is h200_144gb,
    # and this range is an original assumption of exactly the shape that was
    # already refuted once. The retired h200 assumption was [300, 1200] and
    # measurement put it at [216, 306]: 7.5-17x too fast at the top, which is
    # why the pilot was costed at a quarter of its true time and killed at the
    # wall. A [150, 600] range is a 4x span, and a 4x span is not an estimate,
    # so no approval-gate number for this hardware may be quoted from it.
    #
    # ⚠️ It is deliberately NOT replaced by a bandwidth-ratio guess. Scaling the
    # h200 measurement by a memory-bandwidth ratio would be a first-order model
    # for the DECODE term only, while the measured range already absorbs
    # python/import/cache setup that does not scale with bandwidth at all — so
    # the derived number would look principled and be wrong in an unknown
    # direction. This repo's own rule is that a measurement is only as current
    # as the code it timed; a derived one is worse.
    #
    # Tuning path, and it is cheap enough that guessing is not worth it: the
    # xc cluster's 8 A100-80GB cards are the reason this profile now matters,
    # the box is free, and the FIRST run there measures this knob the same way
    # the pilot measured the h200 one. `scripts/tune_cost_model.py --all` reads
    # completed run records and divides each preset's census by its measured
    # wall clock. Down-sync the records first: the tuner can only fit what is
    # local, and it does not know what it cannot see.
    decode_tokens_per_s: [150, 600]
    load_seconds: 300
    measured: false   # the xc cluster's card; the first run there measures it
  v100_32gb:
    label: "V100 32GB (SXM2/PCIe) — UNUSABLE with the current torch"
    vram_gb: 32
    # KEPT AS A TOMBSTONE, not an option. V100 is Volta (sm_70), and no torch
    # this project can use carries sm_70: measured on the cluster 2026-08-02,
    # BOTH 2.13.0+cu130 and 2.11.0+cu128 compile for sm_75/80/86/90/100/120
    # only. PyTorch dropped Volta after 2.10, so this is a torch-version limit,
    # not a CUDA-version one — pinning an older CUDA build does NOT bring the
    # V100 pool back (an earlier note here claimed otherwise and was wrong).
    # Reaching V100 would mean pinning torch==2.10.x exactly, which is what the
    # guardrail sibling does and why its pin is exact rather than a range.
    # This matters because V100 is by far the highest-availability GPU in NEU
    # Explorer's public pool, which makes it the obvious-looking fallback and
    # the wrong one; costing against it would produce a confident estimate for
    # hardware the job cannot start on.
    prefill_tokens_per_s: [600, 2500]
    decode_tokens_per_s: [50, 200]
    load_seconds: 300
    measured: false   # unusable with the current torch
  h200_144gb:
    label: "H200 144GB"
    vram_gb: 144
    prefill_tokens_per_s: [4000, 16000]
    # !! STILL ASSUMED. No run record carries a prefill measurement, so this is
    # the one number on the measured profile that has never been checked. It
    # contributes 0.01-0.05 h of a multi-hour estimate, so it is not worth a
    # measurement pass of its own; it IS worth not calling it measured.
    #
    # RE-TUNED 2026-08-08 from 13 completed runs (`scripts/tune_cost_model.py`,
    # artifact `outputs/analysis/cost_recalibration_20260808.json`). It was
    # [40, 71], measured on the phase-0 pilot 2026-08-04, and that measurement
    # is now known to have absorbed a DEFECT: `a0855fa` pinned probe fits
    # single-threaded, which is 31x faster than the 8 threads an 8-CPU
    # allocation takes by default. So the pilot timed a run that no longer
    # exists, and every estimate since over-predicted time by at least 3.3x.
    # Third value for this knob, and the first fitted to more than one run.
    #
    # READ THIS AS AN EFFECTIVE END-TO-END RATE, not a kernel benchmark: the
    # denominator is BUDGETED max_new_tokens (an upper bound on tokens actually
    # emitted) and the numerator is run wall clock, so it absorbs capture
    # passes, probe fitting, unbatched generation and synchronous judge latency.
    # That is precisely what a wall-clock estimate needs; a raw tokens/s figure
    # would understate the time again in the same direction.
    #
    # ⚠️ THE RANGE IS FITTED TO ONE SHAPE — a ladder sweep of >= 3 rungs at
    # n >= 50, which is what the approval gate is asked about. Runs of other
    # shapes imply different rates and are NOT bugs: the estimator has no
    # per-run fixed-cost term, so a 1-rung plaintext baseline amortises probe
    # fitting and judge setup over eight times less work and implies 409-490
    # tok/s, while the n=8 smoke implies 92.5. Costing a 1-rung run against
    # this range over-predicts it by ~1.8x, which is the safe direction; the
    # n=8 case is the unsafe one and is why the smoke shape is named here
    # rather than silently averaged in. Adding a fixed-cost term would remove
    # the stratification — filed, not done.
    #
    # ⚠️ THE LOW END IS THE HELD-OUT SET, NOT THE FITTED ONE. The 13 fitted runs
    # span 233-305 tok/s, and the first thing checked against the new range was
    # the four `spread_*` runs — whose records live only on the cluster, so the
    # tuner could not see them and they are a genuine held-out set. They took
    # 1:12-1:22 of job wall clock (sacct, 2026-08-08) against a census of
    # 998,400 decode tokens, which implies ~216 tok/s at the slow end: BELOW the
    # fitted floor. The low end is set to that rather than to the fit, because
    # under-predicting time is the direction that gets a job killed at the wall,
    # and because job wall clock charges the estimator for python/import/cache
    # setup that `load_seconds` does not separately model. Fitting only to the
    # runs that happen to be local would have produced a floor 8% too fast.
    #
    # Tuning path, and it is now automated: re-run `scripts/tune_cost_model.py
    # --all` after any batch of runs. It reads completed run records, divides
    # each preset's census by its measured wall clock, prints what it excluded
    # and why, and flags a configured range that no longer overlaps the
    # measured one. Keyless, no GPU, seconds. Down-sync the cluster's run
    # records before trusting its floor — the tuner can only fit what is local,
    # and it does not know what it cannot see.
    decode_tokens_per_s: [216, 306]
    load_seconds: 300
    measured: true   # fitted from 13 completed runs, 2026-08-08

# The scheduler's hard walls. A per-model estimate that exceeds
# `max_wall_clock_hours` is not a slow run, it is a job that gets killed
# mid-sweep — so the cost model checks against these rather than only reporting
# hours.
#
# NEU Explorer's `gpu` partition. These are not read off a docs page: they were
# measured from the owner's own account (`scontrol show partition`, `sacctmgr
# show assoc`) and recorded in the devices repo's canonical cluster notes,
# `knowledge/clusters/nurc_cluster_properties.md`. The 1-GPU-per-job cap is a
# QOS limit, not a preference — the account carries only the `normal` QOS, so
# `--gres=gpu:2` never schedules (reason `QOSMaxGRESPerJob`) and `--qos=multigpu`
# is rejected outright. Single-GPU is the only shape available to this project.
scheduler:
  partition: gpu
  max_wall_clock_hours: 8
  gpus_per_job: 1
  max_concurrent_jobs: 4
  # Explorer is free of charge to Northeastern students and faculty, so the
  # money line of the approval gate is judge API spend only. If this line ever
  # becomes non-zero the gate's $ figure changes shape, not just size.
  gpu_usd_per_hour: 0.0

judge:
  # Prices are NOT configured here. `llm_utils.LLMModel` already carries the
  # per-model price table the whole family bills against (gpt-5-mini: $0.25/M
  # input, $2.00/M output, verified against OpenAI's pricing page 2026-08-02),
  # and a second copy would drift. The cost model reads it from there.
  #
  # Characters per token for judge-side prompts. The judge prompt is English
  # prose plus a model response, so the standard ~4 holds; it is only used for
  # the judge bill, which is dollars-scale, not the GPU estimate.
  # Tuning path: the pilot's judge service reports real token usage
  # (llm_utils UsageStats), so the first run replaces this with observed counts.
  chars_per_token: 4
  # gpt-5-mini is a REASONING model: hidden reasoning tokens are billed as
  # output tokens even though they never appear in the verdict (OpenAI reasoning
  # guide, checked 2026-08-02). The visible verdict is a short JSON object, so
  # reasoning dominates the output bill and ignoring it would understate judge
  # cost several-fold. Range, not a point, because effort is not pinned in
  # conf/judges.yaml. Tuning path: the first run's observed completion-token
  # count per verdict, which llm_utils records.
  output_tokens_per_verdict: [150, 700]

# Scale of the later phases, relative to the phase-0 census. These are the
# ROUGH half of "a rough cost model" (TODO item 1c) — phase 0 is costed from
# measured token counts, phases 1-3 from the design in s1_idea_check.md §7 and
# a multiplier per phase. They are planning figures for the S3 design doc, and
# each is re-derived from real numbers once the phase before it has run.
phases:
  phase1_diagnosis:
    # Probes over layers x positions, re-reading phase-0's activation cache;
    # the new cost is capturing a larger corpus (AdvBench/HarmBench/
    # MaliciousInstruct + Alpaca), with no generation at all.
    description: "diagnosis — probe sweep on a larger corpus, capture only"
    prefill_multiple: 5.0
    decode_multiple: 0.0
    judge_multiple: 0.0
  phase2_causal:
    # Directional ablation, activation addition and the reply-inversion test:
    # generation with hooks, over the same ladder, several intervention arms.
    description: "causal validation — ablation / addition / reply-inversion"
    prefill_multiple: 1.0
    decode_multiple: 3.0
    judge_multiple: 3.0
  phase3_intervention:
    # The crossed experiment: LoRA fine-tunes (train-family subsets x held-out
    # families) plus the must-run baselines, each fine-tune re-evaluated through
    # the whole phase-0 measurement suite. `finetunes` counts training runs;
    # each also pays one phase-0-sized evaluation, which is what the decode and
    # judge multiples encode.
    description: "crossed intervention — LoRA grid + baselines, each fully evaluated"
    finetunes: 12
    gpu_hours_per_finetune: [1.0, 4.0]
    prefill_multiple: 12.0
    decode_multiple: 12.0
    judge_multiple: 12.0
